name: build-test-release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: nightsage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore NINA.Plugin.NightSage.sln
      - name: Build
        run: dotnet build NINA.Plugin.NightSage.sln -c Release -p:Platform=x64 --no-restore
      - name: Test
        run: dotnet test tests/NINA.Plugin.NightSage.Tests/NINA.Plugin.NightSage.Tests.csproj -c Release -p:Platform=x64 --no-build
      - name: Package
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $buildDir = "src/NINA.Plugin.NightSage/bin/x64/Release/net8.0-windows7.0"
          $stage = "release/NightSage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item (Join-Path $buildDir "NINA.Plugin.NightSage.dll") $stage
          $pdb = Join-Path $buildDir "NINA.Plugin.NightSage.pdb"
          if (Test-Path $pdb) { Copy-Item $pdb $stage }
          $protectedData = Join-Path $buildDir "System.Security.Cryptography.ProtectedData.dll"
          if (Test-Path $protectedData) { Copy-Item $protectedData $stage }
          Copy-Item README.md $stage
          Copy-Item CHANGELOG.md $stage
          Copy-Item LICENSE.txt $stage
          New-Item -ItemType Directory -Path "$stage/docs" -Force | Out-Null
          Copy-Item docs/USER_GUIDE.md "$stage/docs"
          Copy-Item docs/PRIVACY.md "$stage/docs"
          Copy-Item docs/TROUBLESHOOTING.md "$stage/docs"
          Compress-Archive -Path "$stage/*" -DestinationPath "release/NightSage-0.2.0-beta.1.zip" -Force
      - name: Upload build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: NightSage-0.2.0-beta.1
          path: release/NightSage-0.2.0-beta.1.zip
          retention-days: 30
      - name: Publish prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentSha = git rev-parse HEAD
          $remoteSha = gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha
          if ($currentSha -ne $remoteSha) { Write-Host "A newer main commit exists; skipping prerelease publication for this stale run."; exit 0 }
          $tag = "v0.2.0-beta.1"
          gh release delete $tag --yes --cleanup-tag 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "No existing alpha release to replace." }
          git tag -f $tag
          git push origin $tag --force
          gh release create $tag "release/NightSage-0.2.0-beta.1.zip" --title "NightSage 0.2.0-beta.1" --prerelease --notes-file CHANGELOG.md
