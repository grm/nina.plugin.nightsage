name: Feature request
description: Suggest a NightSage workflow or planning improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Astrophotography / N.I.N.A. context
      description: Explain the setup/workflow where this matters.
